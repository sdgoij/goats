# The goats workspace: the client and the JS scene, plus the networking crates
# the multiplayer milestone adds. The assets (the model, `sfx/`, `tex/`) stay at
# the repository root; the client reaches them with a relative `include_bytes!`.
[workspace]
resolver = "3"
members = ["crates/goats", "crates/harness", "crates/mods", "crates/plugin", "crates/proto", "crates/pull", "crates/scene", "crates/server", "crates/session"]
# `cargo run` and a bare `cargo build` mean the client, so the README's
# `cargo run --release` keeps working. Use `--workspace` to build or test all.
default-members = ["crates/goats"]

# Every external dependency is declared here once — source and version only —
# so a version bump or a fork swap is a single line. Each crate depends on
# `workspace = true` and adds only the features it needs.
[workspace.dependencies]
# Internal crates, addressed by path.
session = { path = "crates/session" }
mods = { path = "crates/mods" }
scene = { path = "crates/scene" }
proto = { path = "crates/proto" }
plugin = { path = "crates/plugin" }
pull = { path = "crates/pull" }

# The engine. Flip between the published revision and a local checkout here.
slag = { git = "https://github.com/sdgoij/slag" }
# slag = { path = "slag/crates/slag" }

# Serialisation / framing.
serde = { version = "1" }
serde_json = "1"

# Async runtime (features are per-crate).
tokio = { version = "1" }

# Client-only audio (M13b).
cpal = "0.18"
libopus_sys = { version = "0.4" }
raylib-sys = { version = "6.0.0", default-features = false }

# Mod loader.
notify = "8"
zip = { version = "0.6", default-features = false }

# Wire format.
postcard = { version = "1", default-features = false }

# Networking (session only).
iroh = "1.2.0"
iroh-tickets = "1.0"
bytes = "1"

# The release profile the game is measured with. One codegen unit on purpose:
# with the default 16, the same source lands in different codegen-unit partitions
# (the partition hash includes a crate's metadata, which includes its source id),
# and that alone moved native-call dispatch by 13-29% in these measurements --
# see `PERF.md` §6. The trade is build time (~30 s -> ~2 m 35 s for the client)
# against ~13% of every frame.
[profile.release]
codegen-units = 1
lto = "thin"

# The everyday profile, and the default: `cargo run`, `cargo build`, `cargo test`.
# `debug = 1` is line tables rather than the default full DWARF -- which is most of what a
# link spends its time on -- and `opt-level = 1` keeps the native half of a frame quick
# enough to play. Neither of the release settings above is worth paying for in a loop: the
# frame's work lives in the JS scene, and what is native here is the bundle, the registry
# and the engine glue.
[profile.dev]
opt-level = 1
debug = 1

# The profile a *long test* wants, **for local runs only**: release's optimisation without
# the link it pays for that optimisation -- no LTO, and the default 16 codegen units, which
# is exactly what the comment above trades away for its 13%. `scene_logic` is the case it
# exists for (minutes of scene, so the run dwarfs the build either way, and 8x that run at
# `dev`'s speed is worse than the link). A bench or a frame measurement wants `--release`
# precisely, which is why the numbers in `PERF.md` are taken there and nowhere else -- and
# so does CI, which gates on the build that ships rather than on this one.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
debug = false
