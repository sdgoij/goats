# The goats workspace: the client and the JS scene, plus the networking crates
# the multiplayer milestone adds. The assets (the model, `sfx/`, `tex/`) stay at
# the repository root; the client reaches them with a relative `include_bytes!`.
[workspace]
resolver = "3"
members = ["crates/goats", "crates/session"]
# `cargo run` and a bare `cargo build` mean the client, so the README's
# `cargo run --release` keeps working. Use `--workspace` to build or test all.
default-members = ["crates/goats"]
