<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slag Goat</title>
    <style>
      /* The shell around the client. The game draws into a canvas in a 16:9
         stage, about the width of a YouTube player; everything else on this
         page is chrome, not the client. Keep it dependency-free: this file is
         copied beside the export rather than built. */
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --panel: #12161c;
        --line: #232a33;
        --ink: #c8d0da;
        --dim: #7d8794;
        --accent: #8ec07c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 650;
        letter-spacing: 0.14em;
        font-size: 13px;
      }
      .brand .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgb(142 192 124 / 70%);
      }
      .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .field { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); }
      select, button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 11px;
      }
      select:disabled, button:disabled { opacity: 0.45; }
      button { cursor: pointer; }
      button:not(:disabled):hover { border-color: #3a4552; }
      button.primary { border-color: #3f5c39; color: #dff0d8; }
      main {
        flex: 1;
        width: 100%;
        padding: 24px 20px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      /* The stage: what a viewer thinks of as "the game". */
      #player {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .stage {
        position: relative;
        width: min(100%, 1120px);
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 18px 60px rgb(0 0 0 / 55%);
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        outline: none;
      }
      /* The Godot export's own boot screen, kept over the canvas until its
         `startGame` resolves. The reference client has no equivalent: its module
         compiles behind a black canvas. */
      .status {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: none;
        place-items: center;
        background: #0b0d10;
      }
      .status.show { display: grid; }
      #status-progress { width: 46%; height: 5px; accent-color: var(--accent); }
      #status-notice {
        max-width: 76%;
        margin: 0 auto;
        color: var(--ink);
        font: 13px/1.5 system-ui, sans-serif;
        text-align: center;
        white-space: pre-wrap;
      }
      .stage:fullscreen {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      .stage:fullscreen canvas {
        inset: 0;
        margin: auto;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
      .caption {
        width: min(100%, 1120px);
        margin: 0;
        color: var(--dim);
        font-size: 12.5px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .caption a { color: var(--accent); text-decoration: none; }
      .caption a:hover { text-decoration: underline; }

      /* The mod editor scaffold. Inline with the player, same width, so the
         16:9 stage stays the page's only fixed-size box. */
      #mods {
        width: min(100%, 1120px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .panel-head {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .panel-head h2 { margin: 0; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
      .panel-head p { margin: 0; color: var(--dim); font-size: 12.5px; }
      .mods-grid { display: grid; grid-template-columns: 220px 1fr; min-height: 360px; }
      @media (max-width: 720px) { .mods-grid { grid-template-columns: 1fr; } }
      .mods-side {
        padding: 14px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      @media (max-width: 720px) {
        .mods-side { border-right: 0; border-bottom: 1px solid var(--line); }
      }
      .mod-list { list-style: none; margin: 8px 0 0; padding: 0; flex: 1; }
      .mod-list li {
        padding: 7px 9px;
        border-radius: 6px;
        color: var(--dim);
        font-size: 12.5px;
      }
      .mod-list .empty { border: 1px dashed var(--line); text-align: center; }
      .mod-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        padding: 7px 9px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .mod-item:hover, .mod-item.open { border-color: var(--line); background: #161a20; }
      .mod-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dim);
        flex: 0 0 auto;
      }
      .mod-dot.loaded { background: var(--accent); }
      .mod-dot.failed { background: #d1554a; }
      .mod-meta { margin-left: auto; color: var(--dim); font-size: 10.5px; }
      .mods-main { display: flex; flex-direction: column; min-width: 0; }
      .tabline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #mod-source {
        flex: 1;
        min-height: 240px;
        resize: vertical;
        padding: 14px;
        border: 0;
        outline: 0;
        background: #0d1014;
        color: #b9c4d0;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        tab-size: 4;
      }
      .editor-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      .editor-actions .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
      footer {
        padding: 0 20px 22px;
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }
      footer a { color: var(--accent); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="dot"></span> SLAG GOAT</div>
      <div class="controls">
        <label class="field">
          Client
          <select id="client" aria-label="Client">
            <option value="godot" selected>Godot (WebAssembly)</option>
            <!-- Enabled by the probe below when `reference/index.html` exists;
                 a Godot-only package leaves it disabled rather than offering
                 a 404. -->
            <option value="reference" disabled>Reference (raylib / WASM)</option>
          </select>
        </label>
        <button id="mods-toggle" aria-expanded="false" aria-controls="mods">Mod editor</button>
        <button id="fullscreen">Fullscreen</button>
      </div>
    </header>

    <main>
      <section id="player" aria-label="Game client">
        <div class="stage" id="stage">
          <!-- The selected client boots into this canvas as soon as the page is
               ready -- no iframe and no start gate. It owns the stage from there. -->
          <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
          <div class="status" id="status">
            <div>
              <progress id="status-progress" value="0" max="1"></progress>
              <div id="status-notice" hidden></div>
            </div>
          </div>
        </div>
        <p class="caption">
          <span id="client-name">Godot client</span>
          <a id="open-tab" href="client/index.html" target="_blank" rel="noopener">open in a new tab</a>
        </p>
      </section>

      <!-- The running client's mod table. The list and the editor talk to the
           Godot client over the bridge `mods.gd` installs on its window; the
           reference client has no bridge, so the panel says so. -->
      <section id="mods" hidden aria-labelledby="mods-title">
        <div class="panel-head">
          <h2 id="mods-title">Mod editor</h2>
          <p>The running Godot client's mod table.</p>
        </div>
        <div class="mods-grid">
          <aside class="mods-side">
            <button class="primary" id="mod-new" type="button">New mod</button>
            <button id="mod-import" type="button" disabled title="Not wired yet">Import…</button>
            <ul class="mod-list"><li class="empty">Waiting for the client…</li></ul>
          </aside>
          <div class="mods-main">
            <div class="tabline"><span id="mod-file">untitled/mod.js</span><span class="badge" id="mod-badge">unsaved</span></div>
            <textarea id="mod-source" spellcheck="false" aria-label="Mod source">// A mod entry receives the live `goats` handle (APIv1.md).
//
// goats.command("hello", function () { return "ok hello"; });
</textarea>
            <div class="editor-actions">
              <button id="mod-run" type="button" disabled>Run</button>
              <button id="mod-save" type="button" disabled>Save</button>
              <button id="mod-export" type="button" disabled title="Not wired yet">Export</button>
              <span class="hint" id="mod-hint">Open a mod to edit its entry.</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      Clients: <a href="https://godotengine.org/" target="_blank" rel="noopener">Godot</a> (WebAssembly)
      &middot; Reference (raylib / WASM) &middot; mods run on
      <a href="https://github.com/sdgoij/slag" target="_blank" rel="noopener">Slag</a>.
    </footer>

    <script>
      // One place to teach the shell about a client. There is no iframe: the
      // selected client boots straight into this page's canvas. A switch is a
      // top-level navigation (`?client=...`) because two wasm engines cannot share
      // one global scope, and the engine has no unload worth relying on.
      //
      // `__BUILD__` is replaced by the packaging script with the moment it ran. A
      // rebuilt client then has new URLs, so a normal reload does not have to be a
      // hard reload: only the shell itself is revalidated, and everything below it
      // is a fresh URL. The Godot export's pack gets its own stamp in `mainPack`.
      const BUILD = "__BUILD__";
      const CLIENTS = {
        godot: { label: "Godot client", page: "client/index.html", boot: bootGodot },
        reference: { label: "Reference client", page: "reference/index.html", boot: bootReference },
      };

      const select = document.getElementById("client");
      const clientName = document.getElementById("client-name");
      const openTab = document.getElementById("open-tab");
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("canvas");
      const status = document.getElementById("status");
      const statusProgress = document.getElementById("status-progress");
      const statusNotice = document.getElementById("status-notice");
      const params = new URLSearchParams(window.location.search);

      let active = CLIENTS[params.get("client")] ? params.get("client") : "godot";

      // The caption follows the selected client.
      function describe(name) {
        const client = CLIENTS[name];
        clientName.textContent = client.label;
        openTab.href = client.page;
      }

      // The stage's boot screen, over the canvas. Godot reports progress through
      // `startGame`; the reference client has no progress to report, so only a
      // failure notice ever appears for it.
      function showStatus() {
        statusNotice.hidden = true;
        statusNotice.textContent = "";
        statusProgress.hidden = false;
        statusProgress.removeAttribute("value");
        statusProgress.removeAttribute("max");
        status.classList.add("show");
      }

      function notice(text) {
        statusProgress.hidden = true;
        statusNotice.textContent = String(text);
        statusNotice.hidden = false;
        status.classList.add("show");
      }

      function hideStatus() {
        status.classList.remove("show");
      }

      function stageSize() {
        const width = Math.max(1, Math.round(canvas.clientWidth || stage.clientWidth || 854));
        const height = Math.max(1, Math.round(canvas.clientHeight || stage.clientHeight || 480));
        return [width, height];
      }

      // The Godot export's own bootstrap, without its document: the same Engine
      // and progress screen, with the paths one directory deeper because the shell
      // is the top-level page. The extension is preloaded into the virtual FS as
      // `goats_godot.wasm` -- the name the pack's descriptor resolves -- from its
      // stamped `client/` URL, so a rebuilt extension is a new URL too.
      function bootGodot() {
        showStatus();
        // `canvasResizePolicy: 0` (none) and a canvas that is already the stage's
        // size: the adaptive policy would size the buffer to the *window*, and
        // without an iframe there is no window boundary to inherit -- the stage is
        // the client's box.
        const [width, height] = stageSize();
        canvas.width = width;
        canvas.height = height;
        const script = document.createElement("script");
        script.src = "client/index.js?v=" + BUILD;
        script.onload = () => {
          const config = {
            args: [],
            canvasResizePolicy: 0,
            emscriptenPoolSize: 8,
            ensureCrossOriginIsolationHeaders: true,
            executable: "client/index",
            experimentalVK: false,
            mainPack: "client/index.pck?v=" + BUILD,
            focusCanvas: true,
            // Preloaded by hand below, so the stamped source and the descriptor's
            // name can differ; an empty list also skips the exporter's own
            // "extensions unsupported" check, which the `web_dlink` template
            // passes anyway.
            gdextensionLibs: [],
            godotPoolSize: 4,
          };
          const missing = Engine.getMissingFeatures({ threads: false });
          if (missing.length !== 0) {
            notice("This browser is missing features Godot needs:\n" + missing.join("\n"));
            return;
          }
          const engine = new Engine(config);
          engine
            .preloadFile("client/goats_godot.wasm?v=" + BUILD, "goats_godot.wasm")
            .then(() =>
              engine.startGame({
                onProgress: (current, total) => {
                  if (current > 0 && total > 0) {
                    statusProgress.value = current;
                    statusProgress.max = total;
                  } else {
                    statusProgress.removeAttribute("value");
                    statusProgress.removeAttribute("max");
                  }
                },
              }),
            )
            .then(() => {
              hideStatus();
              refreshMods();
            }, (error) => notice(error instanceof Error ? error.message : String(error)));
        };
        script.onerror = () => notice("client/index.js did not load");
        document.body.appendChild(script);
      }

      // The reference client's Emscripten module, straight into the same canvas.
      // `goats.js` is the glue; `goats.wasm` is resolved by `locateFile`, which
      // carries the build stamp. `--viewport` is how the wasm learns its size (it
      // cannot read this page's globals).
      function bootReference() {
        const [width, height] = stageSize();
        window.Module = {
          // The browser is the embedder with the least headroom: Slag's default
          // young cohort (8192 boxes) collects about once a second, each pause a
          // few hundred milliseconds on a busy world (`WASM.md` risk 1). Fewer,
          // longer collections are the right trade here; `?nursery=N` still tunes
          // it per load.
          arguments: [
            "--viewport", width + "x" + height,
            "--nursery-threshold", params.get("nursery") || "65536",
          ],
          canvas: canvas,
          locateFile: function (path) {
            // The glue lives in `reference/`, but this page is the shell at the
            // root; Emscripten's default would resolve the module next to the
            // glue, so the prefix is ours to add once `locateFile` is overridden.
            if (/^(https?:|\/|data:)/.test(path)) return path;
            return "reference/" + path + (path.indexOf("?") < 0 ? "?v=" + BUILD : "");
          },
          onRuntimeInitialized: function () {
            const frame = window.Module._goats_frame || window.Module.goats_frame;
            if (!frame) {
              notice("goats_frame was not exported");
              return;
            }
            requestAnimationFrame(function tick() {
              if (frame()) requestAnimationFrame(tick);
            });
          },
        };
        const glue = document.createElement("script");
        glue.src = "reference/goats.js?v=" + BUILD;
        glue.onerror = () => notice("reference/goats.js did not load");
        document.body.appendChild(glue);
      }

      // The reference client is a separate build (`web/build.sh client`), staged
      // by `package_web.sh` under `reference/` when it exists. Probe it once so a
      // Godot-only package can disable the option instead of loading a 404.
      const referenceOption = select.querySelector('option[value="reference"]');
      if (active !== "godot") select.value = active;
      describe(active);
      // No start gate: the selected client boots on arrival. The Godot side is
      // always packaged; the reference side waits for the probe.
      if (active === "godot") CLIENTS.godot.boot();

      fetch("reference/goats.js", { method: "HEAD" })
        .then((response) => {
          if (response.ok) referenceOption.disabled = false;
          if (active !== "reference") return;
          if (response.ok) CLIENTS.reference.boot();
          else notice("The reference client is not packaged (run web/build.sh client).");
        })
        .catch(() => {
          if (active === "reference") {
            notice("The reference client is not packaged (run web/build.sh client).");
          }
        });

      // One engine per document: a switch is a fresh document with the new client
      // selected, and that client boots on arrival.
      select.addEventListener("change", () => {
        const next = select.value;
        if (!CLIENTS[next]) return;
        window.location.href = "?client=" + encodeURIComponent(next);
      });

      document.getElementById("fullscreen").addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else stage.requestFullscreen?.();
      });

      // ---- The mod editor ---------------------------------------------------
      // The running Godot client installs `goatsModsSave` / `goatsModsReload` /
      // `goatsModsRead` / `goatsModsState` on its window (`mods.gd`), and publishes
      // every answer on `goatsModsLast` as well. Same-origin means the shell reads
      // that property directly; the callback's own return value is not reliable
      // across browsers. The reference client has no bridge.
      const mods = document.getElementById("mods");
      const modsToggle = document.getElementById("mods-toggle");
      const modList = document.querySelector(".mod-list");
      const modSource = document.getElementById("mod-source");
      const modFile = document.getElementById("mod-file");
      const modBadge = document.getElementById("mod-badge");
      const modNew = document.getElementById("mod-new");
      const modRun = document.getElementById("mod-run");
      const modSave = document.getElementById("mod-save");
      const modHint = document.getElementById("mod-hint");

      let openName = "";
      let openEntry = "mod.js";
      let openFiles = {};
      let modRefresh = 0;

      const modB64 = (text) => {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      };
      const modText = (text) =>
        new TextDecoder().decode(Uint8Array.from(atob(text), (c) => c.charCodeAt(0)));

      // The client's bridge, when the Godot client is the one booted in this
      // document (`mods.gd` installs it on `window`). Both the call and the read
      // are synchronous; a missing bridge is simply null.
      function modCall(fn, arg) {
        if (typeof window[fn] !== "function") return null;
        try {
          window.goatsModsLast = "";
          if (arg === undefined) window[fn]([]);
          else window[fn](arg);
          return window.goatsModsLast ? String(window.goatsModsLast) : null;
        } catch (error) {
          return null;
        }
      }

      // The folder name a mod is saved under is not in the table (only its id and
      // display name are), so the editor names a copy after the display name and
      // falls back to the id's last segment for a build's own mod.
      function modSlug(row) {
        return String(row.name || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "");
      }

      function renderMods(rows) {
        modList.textContent = "";
        if (!rows || rows.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = rows
            ? "No mods loaded"
            : active === "godot"
              ? "Waiting for the client…"
              : "The mod editor needs the Godot client";
          modList.append(li);
          return;
        }
        for (const row of rows) {
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "mod-item";
          button.title = String(row.id || "") + " — " + String(row.description || "");
          const dot = document.createElement("span");
          dot.className = "mod-dot";
          if (row.failed) dot.classList.add("failed");
          else if (row.loaded) dot.classList.add("loaded");
          const label = document.createElement("span");
          label.textContent = String(row.name || row.id || "mod");
          const meta = document.createElement("span");
          meta.className = "mod-meta";
          meta.textContent = String(row.side || "") + (row.version ? " " + row.version : "");
          button.append(dot, label, meta);
          button.addEventListener("click", () => openMod(row, button));
          li.append(button);
          modList.append(li);
        }
      }

      function refreshMods() {
        clearInterval(modRefresh);
        if (active !== "godot") {
          renderMods(null);
          return;
        }
        let tries = 0;
        const pull = () => {
          const text = modCall("goatsModsState");
          if (text !== null) {
            clearInterval(modRefresh);
            try {
              const rows = JSON.parse(text);
              renderMods(Array.isArray(rows) ? rows : []);
            } catch (error) {
              renderMods([]);
            }
            return;
          }
          if (++tries > 80) {
            clearInterval(modRefresh);
            renderMods(null);
          }
        };
        pull();
        modRefresh = setInterval(pull, 250);
      }

      function openMod(row, button) {
        const candidates = [modSlug(row), String(row.id || "").split(".").pop()].filter(
          (name, index, all) => name && all.indexOf(name) === index,
        );
        for (const name of candidates) {
          const text = modCall("goatsModsRead", name);
          if (text === null || text.startsWith("error")) continue;
          let data = null;
          try { data = JSON.parse(text); } catch (error) { continue; }
          if (!data || !data.files) continue;
          openName = name;
          openFiles = data.files;
          openEntry = Object.keys(openFiles).find((file) => file.endsWith(".js")) || "mod.js";
          modSource.value = openFiles[openEntry] ? modText(openFiles[openEntry]) : "";
          modFile.textContent = name + "/" + openEntry;
          modBadge.textContent = String(row.side || "client");
          modRun.disabled = false;
          modSave.disabled = false;
          modHint.textContent =
            "Run reloads this buffer without saving; Save writes it to the client's storage.";
          for (const item of modList.querySelectorAll(".mod-item")) {
            item.classList.toggle("open", item === button);
          }
          return;
        }
        modHint.textContent = "Could not read " + (row.name || row.id);
      }

      function modRequest() {
        const files = Object.assign({}, openFiles);
        files[openEntry] = modB64(modSource.value);
        return JSON.stringify({ name: openName, files });
      }

      function modAnswer(action, fn) {
        if (!openName) return;
        const answer = modCall(fn, modRequest());
        if (answer === null) {
          modHint.textContent = action + " failed: the client's bridge is not there";
          return;
        }
        modHint.textContent = answer.startsWith("error") ? action + " failed: " + answer : answer;
        refreshMods();
      }

      modRun.addEventListener("click", () => modAnswer("Run", "goatsModsReload"));
      modSave.addEventListener("click", () => modAnswer("Save", "goatsModsSave"));

      modNew.addEventListener("click", () => {
        const manifest = {
          id: "com.example.untitled",
          name: "Untitled",
          version: "1.0.0",
          api: 1,
          side: "client",
          description: "",
          entry: "mod.js",
          assets: {},
        };
        const entry =
          '// A mod entry receives the live `goats` handle (APIv1.md).\n' +
          'goats.command("hello", function () { return "ok hello"; });\n';
        openName = "untitled";
        openEntry = "mod.js";
        openFiles = {
          "mod.json": modB64(JSON.stringify(manifest, null, 2) + "\n"),
          "mod.js": modB64(entry),
        };
        modSource.value = entry;
        modFile.textContent = "untitled/mod.js";
        modBadge.textContent = "unsaved";
        modRun.disabled = false;
        modSave.disabled = false;
        modHint.textContent =
          "Run reloads this buffer without saving; Save writes it to the client's storage.";
      });

      modsToggle.addEventListener("click", () => {
        const open = mods.hidden;
        mods.hidden = !open;
        modsToggle.setAttribute("aria-expanded", String(open));
        if (open) {
          refreshMods();
          mods.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      refreshMods();
    </script>
  </body>
</html>
