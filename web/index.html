<!doctype html>
<!--
  The browser client's shell (WASM.md W0/D7). The canvas sits in a page, not
  fullscreen: it is sized like an embedded video and the console -- and later the
  chat -- mount around it. The artifact is this file, the generated `goats.js`
  and `goats.wasm`, and -- later -- a preloaded `mods/`.

  The canvas has to be called `canvas`: raylib's web backend reads
  `Module.canvas.id` and then reaches for `#canvas` by name
  (`rcore_web_emscripten.c:115`, `:229`). `tabindex` makes it focusable, which is
  what the keyboard will need; the context menu is suppressed so a right-click
  does not interrupt a camera drag.

  The frame loop is driven from here, once per `requestAnimationFrame`, calling
  the exported `goats_frame` (WASM.md D3) -- no Emscripten main loop, no function
  pointer crossing the JS boundary.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>goats</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #17181c;
        color: #d6d7db;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      /* The page is a single centred column: the game above, the console below. */
      #stage {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: min(92vw, 854px);
      }
      /* Embedded in the shell (`godot/web/index.html`): the iframe is already the
         16:9 stage. The wasm side reads the stage's pixel size from `--viewport`
         (built below), so the framebuffer is the canvas' size rather than
         854x480 upscaled by the browser. */
      body.embedded #stage {
        width: 100%;
        height: 100%;
        gap: 0;
      }
      body.embedded #canvas {
        width: 100% !important;
        height: 100% !important;
      }
      /* The console is an overlay in the embedded form, so the canvas keeps the
         whole 16:9 box; it stays hidden until W2 gives it something to say. */
      body.embedded #console {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
      }
      body.embedded #console:empty {
        display: none;
      }
      /* The game. `height: auto` keeps the client's own aspect ratio -- the
         framebuffer is 1000x640, so a 854px-wide box is ~547px tall. */
      #canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
        border-radius: 4px;
        outline: none;
      }
      /* The console mounts here (W2); the chat will join it later. */
      #console {
        min-height: 1.5em;
        padding: 10px 12px;
        border-radius: 4px;
        background: #101114;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="console"></div>
    </div>
    <script>
      // `?embedded=1` is the shell's form: the page fills the iframe's 16:9
      // stage rather than presenting the standalone video-sized column. The flag
      // also reaches the wasm side as `Module.embedded`; that is where the scene
      // takes its viewport size from, so the framebuffer is the canvas' size and
      // not 854x480 upscaled by the browser.
      var params = new URLSearchParams(window.location.search);
      var embedded = params.get("embedded") === "1";
      // `?v=` is the shell's build stamp (`package_web.sh`). The glue and the wasm
      // are named without one, so they are passed through here; a standalone tab
      // has no stamp and loads them as before.
      var build = params.get("v") || "";
      if (embedded) {
        document.body.classList.add("embedded");
      }

      // The wasm build has no command line; it reads its argv from
      // `Module.arguments`, which Emscripten's glue turns into `env::args()`.
      // Build it from the URL query string so diagnostics can be toggled per
      // load -- `?gctrace=1` turns on the collector's trace (WASM.md, risk 1).
      var queryArgs = [];
      // The shell's iframe is the client's box, not a fixed column: name its pixel
      // size on the command line so raylib's framebuffer matches the canvas. The
      // wasm side cannot read the page's globals (the game runs in the engine's
      // own JS context), so `Module.arguments` is the channel.
      if (embedded) queryArgs.push("--viewport", Math.round(innerWidth) + "x" + Math.round(innerHeight));
      if (params.get("gctrace") === "1") queryArgs.push("--gc-trace");
      // `?nursery=N` is `--nursery-threshold N`: the young-box count that paces a
      // minor collection (the engine's default is 8192).
      var nursery = params.get("nursery");
      if (nursery !== null) queryArgs.push("--nursery-threshold", nursery);

      // Set before the module script runs: Emscripten's glue looks the element up
      // through `Module.canvas`, and raylib then asks for its `id`.
      var Module = {
        arguments: queryArgs,
        // The shell reads this on the wasm side to size the window.
        embedded: embedded,
        canvas: document.getElementById("canvas"),
        // Emscripten asks this for `goats.wasm`; the stamp makes a rebuilt module
        // a new URL rather than a cached one.
        locateFile: function (path) {
          return build ? path + (path.indexOf("?") < 0 ? "?v=" + build : "") : path;
        },
        onRuntimeInitialized: function () {
          // The exported frame entry. Emscripten may or may not prefix it with an
          // underscore depending on the build, so accept either spelling.
          var frame = Module._goats_frame || Module.goats_frame;
          if (!frame) throw new Error("goats_frame was not exported");
          requestAnimationFrame(function tick() {
            if (frame()) requestAnimationFrame(tick);
          });
        },
      };

      // The glue gets the same stamp, so a rebuilt client is not the cached script.
      (function () {
        var glue = document.createElement("script");
        glue.async = true;
        glue.src = "goats.js" + (build ? "?v=" + build : "");
        document.body.appendChild(glue);
      })();
    </script>
  </body>
</html>
