[package]
name = "mods"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The mod loader is pure: filesystem, JSON and hashing only. It deliberately
# does not depend on the engine, so it is unit-testable without a window and the
# headless server can share it (M14d) without pulling raylib in.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Mods may ship as a `.zip`; only the deflate feature is needed, which keeps the
# dependency tree to `flate2`/`miniz_oxide` rather than the archive crate's full
# set of optional codecs.
zip = { workspace = true, features = ["deflate"] }

# The optional file watcher: the platform's native notification API (inotify,
# kqueue, ReadDirectoryChangesW) rather than polling. A wasm module has no such
# API, so the browser build leaves it out (WASM.md section 5) -- and with it
# `watch`, which is the only module that names it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }
