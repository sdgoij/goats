[package]
name = "proto"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Deliberately no iroh and no tokio: this crate is the wire vocabulary, shared by
# the client and the headless server and testable on its own.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The datagram channel is binary (`crate::wire`): the world snapshot is sent ten
# times a second and voice fifty, so the JSON schema's key names and decimal
# digits were the budget. `alloc` is what `to_allocvec`/`from_bytes` need; the
# framing channel stays `serde_json`, because those frames ride the JS bridge and
# are read by humans when a session misbehaves.
postcard = { workspace = true, features = ["alloc"] }
