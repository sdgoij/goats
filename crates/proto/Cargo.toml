[package]
name = "proto"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Deliberately no iroh and no tokio: this crate is the wire vocabulary, shared by
# the client and the headless server and testable on its own.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The voice payload is carried base64 in the JSON datagram: 20 ms of Opus is
# ~60 bytes, so the encoding overhead beats serde's array-of-numbers and keeps
# the whole datagram channel JSON until a binary envelope earns its keep.
base64 = "0.22"
