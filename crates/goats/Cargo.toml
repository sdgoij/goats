[package]
name = "goats"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
session = { workspace = true }
# The mod loader (discovery, manifests, asset bytes). Pure Rust, no engine.
mods = { workspace = true }
# The scene bundle: the ordered parts, the joined script and the `rl` stubs. One
# source, shared with the headless server and the test harness, so they cannot
# disagree about the running order.
scene = { workspace = true }
# The compiled-mod host (M17b): the client drives compiled mods from Rust.
plugin = { workspace = true }
# Fetching a host's world mods (M18d): the client's half of mod sync, which the
# networking thread runs on a refused join.
pull = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
# The engine. `gpu-skinning` changes raylib's own build: a skinned mesh is loaded
# without its deform buffers and the *shader* skins it, which is what takes
# `bots`/`goat_pose`/`shadow_bots` out of the frame (PERF.md section 7.1 item 5).
# The scene branches on `rl.GPU_SKINNING`, so dropping the word below is the whole
# way back to CPU skinning -- keep the flag in both builds measurable.
slag = { workspace = true, features = ["jit", "raylib", "raygui", "gpu-skinning"] }

# Voice chat, client only (M13b). `cpal` opens the microphone, `libopus_sys`
# with `bundled` compiles libopus from source, so there is no system codec to
# install. Neither belongs on the headless server.
cpal = { workspace = true }
libopus_sys = { workspace = true, features = ["bundled"] }

# The `rl` surface has no audio streams, but raylib itself does, and this crate
# already links raylib through the `raylib` feature above. Naming `raylib-sys`
# directly lets the audio module feed a per-peer stream. `default-features =
# false` matches what Slag's runtime asks for, so the two declarations merge
# into the one raylib build rather than a second, differently configured copy.
raylib-sys = { workspace = true }
