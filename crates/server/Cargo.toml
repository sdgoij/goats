[package]
name = "server"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The binary is `goatsd`; the package name only has to be unique in the
# workspace.
[[bin]]
name = "goatsd"
path = "src/main.rs"

[dependencies]
session = { workspace = true }
# The scene bundle: the ordered parts, the joined script and the null `rl` the
# headless world is evaluated against. Shared with the client and the harness.
scene = { workspace = true }
# The server discovers and hashes mods so it can require the world-mod set the
# client must match; it reuses the same pure loader the client does.
mods = { workspace = true }
# The compiled-mod host (M17b): the server drives world `.wasm` mods from Rust.
plugin = { workspace = true }
# The wire protocol: the status page reports the version in use, and the birds
# fixture test checks the whole world still fits one datagram (its cap).
proto = { workspace = true }
# The scene is shared with the client, so the headless world moves by the same
# rules. No `raylib` feature: the server has no window, and `src/headless_rl.js`
# supplies the null `rl` the scene is evaluated against instead.
slag = { workspace = true, features = ["jit"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
