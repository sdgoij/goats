[package]
name = "server"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The binary is `goatsd`; the package name only has to be unique in the
# workspace.
[[bin]]
name = "goatsd"
path = "src/main.rs"

[dependencies]
session = { path = "../session" }
# The scene is shared with the client, so the headless world moves by the same
# rules. No `raylib` feature: the server has no window, and `src/headless_rl.js`
# supplies the null `rl` the scene is evaluated against instead.
slag = { git = "https://github.com/sdgoij/slag", features = ["jit"] }
# slag = { path = "../../slag/crates/slag", features = ["jit"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
