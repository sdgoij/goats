[package]
name = "session"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The only crate that talks to iroh and tokio. `proto` is the wire vocabulary;
# this crate is the transport and the session state machine built on it.
[dependencies]
proto = { path = "../proto" }
serde = "1"
iroh = "1.2.0"
iroh-tickets = "1.0"
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
