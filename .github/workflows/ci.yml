name: CI

# Tests run on every push and pull request. A push to `main` whose tests pass
# also builds the Godot client's browser export and deploys the shell page
# (`godot/web/index.html`) to GitHub Pages. Tagged pushes (`v*`) additionally
# build the release artifacts -- the three desktop binaries, the phone APK, and the
# Godot client for the same three desktop targets -- and publish them as a GitHub
# Release.
#
# The action majors below are the first of each action that run on Node 24: Node
# 20 is removed from the runners on 2026-09-23. See github.blog/changelog,
# "Deprecation of Node 20 on GitHub Actions runners". (checkout v5,
# setup-java v5, cache v6, upload-artifact v7, download-artifact v8,
# action-gh-release v3, setup-android v4; the Pages and emsdk actions below are
# already on Node 24.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The scene tests are Rust (M15): `crates/harness` evaluates the client's exact
  # scene on Slag against a recording `rl` stub, so the suite needs no Node, no
  # raylib and no display. Slag is slow unoptimized, so the harness's long cases
  # are `#[ignore]`d for a local debug run and CI runs the whole crate in release
  # with `--include-ignored` -- one pass over everything, in the profile the
  # engine ships in, which is also what makes the engine's own speed a number.
  test:
    name: Scene tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The client crate is left out: it links raylib, and the build job below is
      # the one that installs the build dependencies for it. `crates/android` is
      # left out for the same reason -- it is the client's cdylib, so building it
      # builds the client. The harness is left out too -- it is the release step
      # below -- so the debug pass is the crates that are fast unoptimized, where
      # debug's overflow and `debug_assert` checks are worth having and cost
      # nothing.
      - name: Test the crates that need no engine
        run: cargo test --workspace --exclude goats --exclude goats-android --exclude harness
      # The scene's own suite: the 4050-frame scripted timeline, the mod cases (the
      # synthetic tables, the checked-in example fixtures and the mod added after
      # the freeze), the birds flock, the sky and the skinning. `--include-ignored`
      # is the point: the long cases are ignored for a local debug run, and this
      # runs them too, so nothing is covered only when someone remembers a second
      # command.
      - name: Test the scene on the engine
        run: cargo test --release -p harness -- --include-ignored --nocapture

  # The Godot client, tested for the same three desktop targets the reference client ships for
  # (`build`'s matrix). None of this ran in CI before: the port was only ever checked by hand on the
  # machine it was written on, which is how a `PROTOCOL_VERSION` mismatch -- a stale extension; the
  # library is git-ignored and rebuilt -- stayed invisible until a player met it. The `jsjoin` mode,
  # whose joiner is the reference client itself, is the one that turns that into a red run.
  #
  # The reference's fourth target, Android, is deliberately absent: the port has no touch layer and no
  # Android preset, so there is nothing to build for it yet.
  #
  # `needs: test`, so it starts only once the scene's own tests and the crates that need no engine
  # are green: there is no point testing and building a client for a scene whose tests are failing.
  #
  # The steps are `sh` on all three runners rather than `sh` on Linux and PowerShell on Windows: the
  # gates are POSIX scripts, and the Windows runner's Git Bash translates the paths Godot (a native
  # binary) is handed -- the same reason the port is developed under MSYS. `timeout`, `unzip`,
  # `sha256sum` and `cygpath` all come with it; on Linux `unzip` is installed below, and the
  # `unzip`/`tar` fallbacks cover a runner that has only one of them.
  godot:
    name: Godot client (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset: Godot_v4.7.2-stable_linux.x86_64.zip
            exe: Godot_v4.7.2-stable_linux.x86_64
            sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            asset: Godot_v4.7.2-stable_linux.arm64.zip
            exe: Godot_v4.7.2-stable_linux.arm64
            sha256: 5dd0d86405cf7e8adf79fb6377b38ba682a2846cb378ffe5364f38c01ad29b9d
          - name: windows-x86_64
            os: windows-latest
            asset: Godot_v4.7.2-stable_win64.exe.zip
            exe: Godot_v4.7.2-stable_win64.exe
            sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # What the extension needs beyond Rust: a C toolchain and cmake for the bundled libopus
      # behind `crates/voice`, and libclang for Slag's bindgen. The raylib and Wayland packages the
      # `build` job installs are not needed here -- `crates/godot` takes Slag without the `raylib`
      # feature, because Godot draws.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev unzip
      # The engine every gate is run by, by release *and* digest. `--headless` is the whole of the
      # need: a gate is a `SceneTree` script, and Godot's build links nothing but the C library --
      # the display, audio and input drivers are all `dlopen`ed -- so no X, no GPU and no extra
      # packages. `--version` doubles as a load test: a missing library fails here, not in a gate.
      - name: Install Godot
        shell: bash
        run: |
          curl -fsSLo godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/${{ matrix.asset }}"
          echo "${{ matrix.sha256 }}  godot.zip" | sha256sum -c -
          mkdir -p godot-bin
          if command -v unzip >/dev/null 2>&1; then
            unzip -q godot.zip -d godot-bin
          else
            tar -xf godot.zip -C godot-bin
          fi
          chmod +x "godot-bin/${{ matrix.exe }}"
          echo "GODOT_BIN=$PWD/godot-bin/${{ matrix.exe }}" >> "$GITHUB_ENV"
          "godot-bin/${{ matrix.exe }}" --version
      # The extension *first*: a godot-rust library is not registered until Godot has scanned the
      # descriptor, so the import pass has to follow the build rather than precede it.
      - name: Build the GDExtension
        shell: bash
        run: sh crates/godot/build.sh release
      - name: Import the project
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path godot --import
      - name: Run the gates
        shell: bash
        run: sh godot/tools/gates.sh
      # The session modes that need no window: `shot` renders in one and `jsjoin` joins with the
      # raylib reference client, so both are left to a machine with a display.
      - name: Run the session modes
        shell: bash
        run: |
          cargo build --release -p server
          for mode in join refuse herd pair death hostdeath pull offline; do
            echo "::group::interop.sh $mode"
            sh godot/tools/interop.sh "$mode"
            echo "::endgroup::"
          done
      # The extension and every gate log, so a red run can be read without reproducing it.
      - name: Upload the extension and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-extension-${{ matrix.name }}
          path: |
            godot/addons/goats_godot/bin/
            target/gate-logs/
          if-no-files-found: ignore

  # The browser client: the GDExtension as an Emscripten side module, Godot's
  # Web export, and the shell page (`godot/web/index.html`) wrapped around it.
  # It is built on every push and pull request once the scene's tests and the
  # desktop client's gates are green -- a PR should prove the browser build, not
  # discover it is broken on merge. Only `main` (and a manual run) deploys: a
  # pull request has no business publishing over the live page.
  #
  # The wasm side is pinned twice, because both halves have moved: emsdk 5.0.7
  # is the Emscripten the extension is linked with, and `nightly-2026-08-29` is
  # the nightly whose `rust-src`/`-Zbuild-std` the port was checked against.
  web:
    name: Web build
    needs: [test, godot]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # gdext's wasm support is nightly-only, and `-Zbuild-std` needs rust-src.
      # `WEB_TOOLCHAIN` is the name build_web.sh asks cargo for, so this is a
      # pin rather than a second, ignored installation.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-29
          components: rust-src
          targets: wasm32-unknown-emscripten
      # The reference client (`web/build.sh client`) is a plain stable build for
      # the same target; making stable the default here leaves the Godot step's
      # explicit `WEB_TOOLCHAIN` pin in charge of its own nightly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev unzip
      # The action caches the SDK under `emsdk-cache`; the version is the one the
      # module's link flags are written for, not "latest".
      - name: Install emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache
      # `web/build.sh` hands bindgen the Emscripten sysroot, which a fresh SDK
      # populates on the first compile. Warming it here makes that path true
      # before the reference client's build script reaches for it.
      - name: Warm the Emscripten sysroot
        shell: bash
        run: |
          printf 'int main(void){return 0;}\n' | emcc -x c - -o "$RUNNER_TEMP/emcc-probe.js"
          test -d "$EMSDK/upstream/emscripten/cache/sysroot"
      # The exporter, by release and digest -- the same editor the desktop job
      # uses, because the preset and the templates are the same ones.
      - name: Install Godot
        shell: bash
        run: |
          curl -fsSLo godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      # The `web_dlink` templates the Web preset selects. The Linux key is the
      # one `godot-build` uses, so the two jobs share a populated cache.
      - name: Restore the export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-${{ runner.os }}-4.7.2.stable
      - name: Install the export templates
        if: steps.templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSLo templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | sha256sum -c -
          rm -rf t
          mkdir -p t
          unzip -q templates.tpz -d t
          dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$(dirname "$dir")"
          rm -rf "$dir"
          mv t/templates "$dir"
      - name: Build the web extension
        shell: bash
        env:
          WEB_TOOLCHAIN: nightly-2026-08-29
        run: sh godot/tools/build_web.sh
      # The raylib client's browser build, staged by `package_web.sh` as
      # `reference/` beside the Godot export's `client/`.
      - name: Build the reference web client
        shell: bash
        run: bash web/build.sh client
      # The export into `client/` and the shell at the root, which is the layout
      # `godot/web/index.html` names (`client/index.html`).
      - name: Export and wrap the client
        shell: bash
        run: sh godot/tools/package_web.sh dist-web
      # A static host serves whatever it is handed; the files below are the ones
      # whose absence would produce a blank frame or a dead switcher option
      # rather than a red build.
      - name: Check the package
        shell: bash
        run: |
          test -f dist-web/index.html
          grep -q 'page: "client/index.html"' dist-web/index.html
          grep -q 'value="reference"' dist-web/index.html
          test -f dist-web/client/index.pck
          test -f dist-web/client/index.side.wasm
          test -f dist-web/client/goats_godot.wasm
          test -f dist-web/reference/index.html
          test -f dist-web/reference/goats.js
          test -f dist-web/reference/goats.wasm
          # The preloaded `/mods`: without it the reference client boots with an
          # empty mod table rather than a visible failure.
          test -f dist-web/reference/goats.data
          ls -lh dist-web dist-web/client dist-web/reference
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  # Publishing is its own job for the two permissions it needs (`pages: write`
  # and an OIDC token) and because the build above also runs on pull requests.
  deploy-web:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment is ordered: a later run waits rather than cancelling one
    # already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # The game embeds every asset it needs, so each release is a single binary.
  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            package: goats-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-latest
            package: goats-linux-x86_64.tar.gz
          # GitHub-hosted arm64 runners; a public repository gets these on the
          # free plan. To build aarch64 without them, this job can instead run
          # on x86-64 under QEMU, or cross-compile with a `cross`/Docker
          # toolchain and an aarch64 sysroot.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            package: goats-linux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v5

      # Slag compiles raylib (via cmake) and its bindings (via bindgen, which
      # needs libclang). The engine builds GLFW with the Wayland backend, which
      # needs the Wayland protocol headers; GLFW loads libwayland-client at
      # runtime with dlopen, so there is no link-time Wayland dependency (the
      # `-lX11` that raylib-sys emits is dropped by --as-needed). The X11 and
      # Mesa headers are installed to cover an X11 build of the engine.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libasound2-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `goats-android` is left out: its only product is the phone's `.so`, and the
      # `android` job builds it for the target that matters. Built here it would be a
      # host `cdylib` nobody packages (and a leftover MSVC linker warning).
      - name: Build
        run: cargo build --release --workspace --exclude goats-android

      # The client's own unit tests -- the one thing the `test` job cannot reach,
      # because it leaves out the crate that links raylib (whose build dependencies
      # are installed above, for the build). Everything else has passed there
      # already: this job needs it. Release, so it reuses the artifacts the step
      # above just built; a debug run would compile the whole dependency tree again,
      # raylib included. The two ignored cases are the ones that need real
      # hardware: a sound card and a microphone.
      - name: Test the client
        run: cargo test --release -p goats

      # Ship the licence, the readme and the mod API reference alongside the
      # self-contained binary, plus the checked-in example mods as zips in `mods/`
      # so a release exercises `.zip` mod loading on its first run.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/mods | Out-Null
          Copy-Item target/release/goats.exe, target/release/goatsd.exe dist/
          Copy-Item README.md, LICENSE.md, APIv1.md dist/
          Compress-Archive -Path mods/birds/* -DestinationPath dist/mods/birds.zip -Force
          Compress-Archive -Path mods/fatguy/* -DestinationPath dist/mods/fatguy.zip -Force
          Set-Content dist/mods/README.txt "birds.zip is a bundled world mod and fatguy.zip a bundled client mod; both load from this directory. Delete them (or run with --no-mods) for an unmodded game."
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.package }} -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/mods
          cp target/release/goats target/release/goatsd dist/
          cp README.md LICENSE.md APIv1.md dist/
          if command -v zip >/dev/null; then
            ( cd mods/birds && zip -qr ../../dist/mods/birds.zip . )
            ( cd mods/fatguy && zip -qr ../../dist/mods/fatguy.zip . )
          else
            python3 -c "import shutil; shutil.make_archive('dist/mods/birds', 'zip', 'mods/birds'); shutil.make_archive('dist/mods/fatguy', 'zip', 'mods/fatguy')"
          fi
          echo "birds.zip is a bundled world mod and fatguy.zip a bundled client mod; both load from this directory. Delete them (or run with --no-mods) for an unmodded game." > dist/mods/README.txt
          tar -czf ${{ matrix.package }} -C dist .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  # P5 in ANDROID.md: the phone build. It is the one job that needs a Java
  # toolchain, the Android SDK and the NDK on top of Rust, and the one whose
  # product is not a desktop archive, so it is a job of its own -- and Linux only,
  # because that is where the SDK and the NDK are cheapest to get.
  android:
    name: Android (arm64-v8a)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      # `javac` for the Activity, and the keytool that makes the throwaway debug
      # keystore. The recipe is tested against 17 (ANDROID.md, "The build,
      # concretely"). v5, not v4: v4 is deprecated and runs on Node 20.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # What the cross build reaches for beyond Rust: ninja is the generator the NDK
      # recipe asks for, cmake drives raylib, bindgen needs libclang (the `build` job
      # installs the same three for the desktop), and `cc` wants a host compiler even
      # when the target is Android.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang libclang-dev

      # The SDK, its cmdline-tools and its build-tools, licensed non-interactively.
      # v4, not v3: v3 has sdkmanager install the `tools` package, which Google has
      # removed from the repository, so it fails before a step of ours has run -- and
      # v4 is the major that runs on Node 24, like the actions above.
      - uses: android-actions/setup-android@v4
      # The NDK is a package of its own, and a runner image may or may not carry one:
      # take the runner's, and install r30 -- the release the port is developed
      # against, and the one version this workflow names -- if it has none.
      - name: Make the NDK available
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME:-}" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            sdkmanager --install "ndk;30.0.16248370"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          fi
          echo "NDK: $ANDROID_NDK_HOME"

      # The environment "The build, concretely" lists, written once and inherited by
      # every step after it -- the versioned `CC_`/`CXX_`/`AR_`/`RANLIB_` names in
      # particular, which `cc` cannot guess for an android triple.
      - name: Set up the cross-compilation environment
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "ANDROID_PLATFORM=26"
            echo "LIBOPUS_ANDROID_PLATFORM=26"
            echo "CMAKE_GENERATOR=Ninja"
            echo "CC_aarch64-linux-android=$BIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64-linux-android=$BIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64-linux-android=$BIN/llvm-ar"
            echo "RANLIB_aarch64-linux-android=$BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android26-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android26 --sysroot=$SYSROOT"
          } >> "$GITHUB_ENV"

      # `--release`, or the phone gets the loop rather than the game. A bare
      # `cargo build` is the `dev` profile: opt-level 1 with overflow checks and
      # `debug_assert` on, none of the release profile's `codegen-units = 1` or
      # `lto = "thin"` -- the settings `PERF.md` §6/§7.1 says are worth 45-49 to
      # 55-62 fps of the same source. The `opt-level` is also what `cmake-rs` reads
      # to pick raylib's `CMAKE_BUILD_TYPE`, so at `dev` the engine beside it is
      # `RelWithDebInfo` (-O2) where release gives it `Release` (-O3).
      - name: Build the cdylib
        run: cargo build --release -p goats-android --target aarch64-linux-android

      - name: Package the APK
        run: bash android/build-apk.sh release

      # Named like the desktop archives, and published with them on a `v*` tag.
      # Release-built but debug-signed: an APK to sideload and try, not one a store
      # would take.
      - name: Name the APK
        run: cp android/build/goats.apk goats-android-arm64-v8a.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-v8a
          path: goats-android-arm64-v8a.apk
          if-no-files-found: error

  # The Godot client's *build*: the same three targets, exported and packaged with what a
  # reference-client release carries.
  #
  # The client's own files cannot match the raylib one's -- a Godot export is the game packed into a
  # `.pck` beside the binary and the GDExtension library the descriptor names -- but everything that
  # *travels with* the client does, because those are the things a player needs: the server
  # (`goatsd`) to host a session of their own, the licence and the API reference, and the two example
  # mods as zips in `mods/`, for the release to exercise on its first run. The port's loader looks
  # for `mods/` beside the executable, the same place the reference's does.
  #
  # It needs the export templates (a ~1.2 GB download covering every platform at once, cached per OS
  # so only the first run pays for it) and the GDExtension built for the target, so it does both.
  #
  # `needs: godot` -- the test job above -- so nothing is packaged from a tree whose gates are red,
  # and it is off the PR path because the template download is large and an export is the one step a
  # PR cannot exercise cheaply.
  godot-build:
    name: Godot build (${{ matrix.name }})
    needs: godot
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset: Godot_v4.7.2-stable_linux.x86_64.zip
            exe: Godot_v4.7.2-stable_linux.x86_64
            sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
            preset: Linux x86_64
            out: goats
            smoke: dist/goats
            package: goats-godot-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            asset: Godot_v4.7.2-stable_linux.arm64.zip
            exe: Godot_v4.7.2-stable_linux.arm64
            sha256: 5dd0d86405cf7e8adf79fb6377b38ba682a2846cb378ffe5364f38c01ad29b9d
            preset: Linux arm64
            out: goats
            smoke: dist/goats
            package: goats-godot-linux-aarch64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            asset: Godot_v4.7.2-stable_win64.exe.zip
            exe: Godot_v4.7.2-stable_win64.exe
            sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
            preset: Windows Desktop
            out: goats.exe
            smoke: dist/goats.console.exe
            package: goats-godot-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev unzip
      # The editor that does the export, by release and digest: a CI run that silently picked up a
      # different engine would be building against something the port is not written for.
      - name: Install Godot
        shell: bash
        run: |
          curl -fsSLo godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/${{ matrix.asset }}"
          echo "${{ matrix.sha256 }}  godot.zip" | sha256sum -c -
          mkdir -p godot-bin
          if command -v unzip >/dev/null 2>&1; then
            unzip -q godot.zip -d godot-bin
          else
            tar -xf godot.zip -C godot-bin
          fi
          chmod +x "godot-bin/${{ matrix.exe }}"
          echo "GODOT_BIN=$PWD/godot-bin/${{ matrix.exe }}" >> "$GITHUB_ENV"
          "godot-bin/${{ matrix.exe }}" --version

      # The templates the export packs with, by digest, into the directory Godot looks in -- and that
      # path is not the same on Linux and on Windows. One key per OS, and both Linux arches share it:
      # the `.tpz` carries every platform's templates, so the directory it unpacks to is identical.
      - name: Restore the export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Roaming/Godot/export_templates/4.7.2.stable' || '~/.local/share/godot/export_templates/4.7.2.stable' }}"
          key: godot-templates-${{ runner.os }}-4.7.2.stable

      - name: Install the export templates
        if: steps.templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSLo templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | sha256sum -c -
          rm -rf templates t
          mkdir -p t
          if command -v unzip >/dev/null 2>&1; then
            unzip -q templates.tpz -d t
          else
            tar -xf templates.tpz -C t
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            dir="$HOME/AppData/Roaming/Godot/export_templates/4.7.2.stable"
          else
            dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          fi
          mkdir -p "$(dirname "$dir")"
          rm -rf "$dir"
          mv t/templates "$dir"
          ls "$dir" | head -6

      # The extension the export bundles, into the path the descriptor names for this platform.
      - name: Build the GDExtension
        shell: bash
        run: sh crates/godot/build.sh release

      # The export proper. A Godot export writes the client, its `.pck`, and the extension library
      # copied in beside them -- and on Windows a console wrapper too, from the preset's own setting.
      - name: Export the client
        shell: bash
        run: |
          mkdir -p dist
          # Godot resolves a relative export path against `--path` (the project),
          # not the shell's cwd, so name the target absolutely. On Windows this is
          # a native path, which is why it is converted where `cygpath` exists.
          out="$PWD/dist/${{ matrix.out }}"
          if command -v cygpath >/dev/null 2>&1; then
            out=$(cygpath -m "$out")
          fi
          "$GODOT_BIN" --headless --path godot --export-release "${{ matrix.preset }}" "$out"
          ls -1 dist

      # A packed client that never boots is a bad release, and the extension is the piece most likely
      # to be missing or built for the wrong platform. `--quit-after` a few frames rather than a
      # `timeout`: the scene says it is offline when it has no ticket and the bridge announces itself
      # as it loads, so those two lines are a boot *and* a loaded GDExtension. The target is the
      # console wrapper on Windows, because that export is GUI-subsystem and a shell does not wait
      # for it -- the plain `.exe` would report an empty exit code and no output at all.
      - name: Smoke the export
        shell: bash
        run: |
          "${{ matrix.smoke }}" --headless --quit-after 120 > smoke.log 2>&1
          code=$?
          cat smoke.log
          if [ "$code" -ne 0 ]; then echo "::error::the exported client exited $code"; exit 1; fi
          grep -q "Initialize godot-rust" smoke.log || { echo "::error::the client never loaded the extension"; exit 1; }
          grep -q "offline: no GOATSD_TICKET" smoke.log || { echo "::error::the client never ran the scene"; exit 1; }

      - name: Build the server
        shell: bash
        run: cargo build --release -p server

      # The same contents a reference release carries, plus the files the Godot export itself needs
      # (the `.pck` and the extension library). A tarball on Linux, because the two binaries' execute
      # bits have to survive it; a zip on Windows, like the reference's own archive.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\mods | Out-Null
          Copy-Item dist/* pkg/
          Copy-Item target/release/goatsd.exe pkg/
          Copy-Item README.md, LICENSE.md, APIv1.md pkg/
          Compress-Archive -Path mods/birds/* -DestinationPath pkg/mods/birds.zip -Force
          Compress-Archive -Path mods/fatguy/* -DestinationPath pkg/mods/fatguy.zip -Force
          Set-Content pkg/mods/README.txt "birds.zip is a bundled world mod and fatguy.zip a bundled client mod; both load from this directory. Delete them (or run with --no-mods) for an unmodded game."
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.package }} -Force
          Get-ChildItem pkg

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p pkg/mods
          cp dist/* pkg/
          cp target/release/goatsd pkg/
          cp README.md LICENSE.md APIv1.md pkg/
          if command -v zip >/dev/null; then
            ( cd mods/birds && zip -qr ../../pkg/mods/birds.zip . )
            ( cd mods/fatguy && zip -qr ../../pkg/mods/fatguy.zip . )
          else
            python3 -c "import shutil; shutil.make_archive('pkg/mods/birds', 'zip', 'mods/birds'); shutil.make_archive('pkg/mods/fatguy', 'zip', 'mods/fatguy')"
          fi
          echo "birds.zip is a bundled world mod and fatguy.zip a bundled client mod; both load from this directory. Delete them (or run with --no-mods) for an unmodded game." > pkg/mods/README.txt
          tar -czf ${{ matrix.package }} -C pkg .
          ls -1 pkg

      - uses: actions/upload-artifact@v7
        with:
          name: godot-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  # Only a tag publishes; ordinary pushes just build and keep the artifacts.
  release:
    name: Publish release
    # `android` as well: the APK is one of the release assets, and the desktop build finishing says
    # nothing about the phone one -- without this edge the release could publish before `android`
    # had even started, or after it had failed. `godot-build` is the same argument for the Godot
    # client, which is a client of its own rather than a fourth desktop archive.
    needs: [build, android, godot-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By `name` rather than by `pattern` or by taking every artifact: one step per
      # asset, which is also the input that fails when an artifact is missing. A
      # `pattern` is a single glob handed to minimatch, so a newline-separated list
      # of these names is one pattern that matches nothing -- download-artifact
      # then reports success having downloaded zero artifacts and never creates
      # `path` at all, which is how `dist` came to not exist. `name` also keeps a
      # future job's artifacts out of the release, which is the point of listing
      # them: the three desktop archives, the phone APK (debug-signed -- see the
      # `android` job), and the Godot client for the same three desktop targets.
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-aarch64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: android-arm64-v8a
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: godot-windows-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: godot-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: godot-linux-aarch64
          path: dist
      - name: List the assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          # A semver prerelease (`v0.2.0-rc.1`) is published as a prerelease;
          # `v0.2.0` stays a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
