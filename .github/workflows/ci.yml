name: CI

# Tests run on every push and pull request. Tagged pushes (`v*`) additionally
# build the three release binaries and publish them as a GitHub Release.
#
# The action majors below are the first of each action that run on Node 24: Node
# 20 is removed from the runners on 2026-09-23. See github.blog/changelog,
# "Deprecation of Node 20 on GitHub Actions runners". (checkout v5,
# setup-java v5, upload-artifact v7, download-artifact v8, action-gh-release v3,
# setup-android v4.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The scene tests are Rust (M15): `crates/harness` evaluates the client's exact
  # scene on Slag against a recording `rl` stub, so the suite needs no Node, no
  # raylib and no display. Slag is slow unoptimized, so the harness's long cases
  # are `#[ignore]`d for a local debug run and CI runs the whole crate in release
  # with `--include-ignored` -- one pass over everything, in the profile the
  # engine ships in, which is also what makes the engine's own speed a number.
  test:
    name: Scene tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The client crate is left out: it links raylib, and the build job below is
      # the one that installs the build dependencies for it. `crates/android` is
      # left out for the same reason -- it is the client's cdylib, so building it
      # builds the client. The harness is left out too -- it is the release step
      # below -- so the debug pass is the crates that are fast unoptimized, where
      # debug's overflow and `debug_assert` checks are worth having and cost
      # nothing.
      - name: Test the crates that need no engine
        run: cargo test --workspace --exclude goats --exclude goats-android --exclude harness
      # The scene's own suite: the 4050-frame scripted timeline, the mod cases (the
      # synthetic tables, the checked-in example fixtures and the mod added after
      # the freeze), the birds flock, the sky and the skinning. `--include-ignored`
      # is the point: the long cases are ignored for a local debug run, and this
      # runs them too, so nothing is covered only when someone remembers a second
      # command.
      - name: Test the scene on the engine
        run: cargo test --release -p harness -- --include-ignored --nocapture

  # The game embeds every asset it needs, so each release is a single binary.
  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            package: goats-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-latest
            package: goats-linux-x86_64.tar.gz
          # GitHub-hosted arm64 runners; a public repository gets these on the
          # free plan. To build aarch64 without them, this job can instead run
          # on x86-64 under QEMU, or cross-compile with a `cross`/Docker
          # toolchain and an aarch64 sysroot.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            package: goats-linux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v5

      # Slag compiles raylib (via cmake) and its bindings (via bindgen, which
      # needs libclang). The engine builds GLFW with the Wayland backend, which
      # needs the Wayland protocol headers; GLFW loads libwayland-client at
      # runtime with dlopen, so there is no link-time Wayland dependency (the
      # `-lX11` that raylib-sys emits is dropped by --as-needed). The X11 and
      # Mesa headers are installed to cover an X11 build of the engine.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libasound2-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `goats-android` is left out: its only product is the phone's `.so`, and the
      # `android` job builds it for the target that matters. Built here it would be a
      # host `cdylib` nobody packages (and a leftover MSVC linker warning).
      - name: Build
        run: cargo build --release --workspace --exclude goats-android

      # The client's own unit tests -- the one thing the `test` job cannot reach,
      # because it leaves out the crate that links raylib (whose build dependencies
      # are installed above, for the build). Everything else has passed there
      # already: this job needs it. Release, so it reuses the artifacts the step
      # above just built; a debug run would compile the whole dependency tree again,
      # raylib included. The two ignored cases are the ones that need real
      # hardware: a sound card and a microphone.
      - name: Test the client
        run: cargo test --release -p goats

      # Ship the licence, the readme and the mod API reference alongside the
      # self-contained binary, plus the checked-in example mods as zips in `mods/`
      # so a release exercises `.zip` mod loading on its first run.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/mods | Out-Null
          Copy-Item target/release/goats.exe, target/release/goatsd.exe dist/
          Copy-Item README.md, LICENSE.md, APIv1.md dist/
          Compress-Archive -Path mods/birds/* -DestinationPath dist/mods/birds.zip -Force
          Compress-Archive -Path mods/fatguy/* -DestinationPath dist/mods/fatguy.zip -Force
          Set-Content dist/mods/README.txt "birds.zip is a bundled world mod and fatguy.zip a bundled client mod; both load from this directory. Delete them (or run with --no-mods) for an unmodded game."
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.package }} -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/mods
          cp target/release/goats target/release/goatsd dist/
          cp README.md LICENSE.md APIv1.md dist/
          if command -v zip >/dev/null; then
            ( cd mods/birds && zip -qr ../../dist/mods/birds.zip . )
            ( cd mods/fatguy && zip -qr ../../dist/mods/fatguy.zip . )
          else
            python3 -c "import shutil; shutil.make_archive('dist/mods/birds', 'zip', 'mods/birds'); shutil.make_archive('dist/mods/fatguy', 'zip', 'mods/fatguy')"
          fi
          echo "birds.zip is a bundled world mod and fatguy.zip a bundled client mod; both load from this directory. Delete them (or run with --no-mods) for an unmodded game." > dist/mods/README.txt
          tar -czf ${{ matrix.package }} -C dist .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  # P5 in ANDROID.md: the phone build. It is the one job that needs a Java
  # toolchain, the Android SDK and the NDK on top of Rust, and the one whose
  # product is not a desktop archive, so it is a job of its own -- and Linux only,
  # because that is where the SDK and the NDK are cheapest to get.
  android:
    name: Android (arm64-v8a)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      # `javac` for the Activity, and the keytool that makes the throwaway debug
      # keystore. The recipe is tested against 17 (ANDROID.md, "The build,
      # concretely"). v5, not v4: v4 is deprecated and runs on Node 20.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # What the cross build reaches for beyond Rust: ninja is the generator the NDK
      # recipe asks for, cmake drives raylib, bindgen needs libclang (the `build` job
      # installs the same three for the desktop), and `cc` wants a host compiler even
      # when the target is Android.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang libclang-dev

      # The SDK, its cmdline-tools and its build-tools, licensed non-interactively.
      # v4, not v3: v3 has sdkmanager install the `tools` package, which Google has
      # removed from the repository, so it fails before a step of ours has run -- and
      # v4 is the major that runs on Node 24, like the actions above.
      - uses: android-actions/setup-android@v4
      # The NDK is a package of its own, and a runner image may or may not carry one:
      # take the runner's, and install r30 -- the release the port is developed
      # against, and the one version this workflow names -- if it has none.
      - name: Make the NDK available
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME:-}" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            sdkmanager --install "ndk;30.0.16248370"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          fi
          echo "NDK: $ANDROID_NDK_HOME"

      # The environment "The build, concretely" lists, written once and inherited by
      # every step after it -- the versioned `CC_`/`CXX_`/`AR_`/`RANLIB_` names in
      # particular, which `cc` cannot guess for an android triple.
      - name: Set up the cross-compilation environment
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "ANDROID_PLATFORM=26"
            echo "LIBOPUS_ANDROID_PLATFORM=26"
            echo "CMAKE_GENERATOR=Ninja"
            echo "CC_aarch64-linux-android=$BIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64-linux-android=$BIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64-linux-android=$BIN/llvm-ar"
            echo "RANLIB_aarch64-linux-android=$BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android26-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android26 --sysroot=$SYSROOT"
          } >> "$GITHUB_ENV"

      # `--release`, or the phone gets the loop rather than the game. A bare
      # `cargo build` is the `dev` profile: opt-level 1 with overflow checks and
      # `debug_assert` on, none of the release profile's `codegen-units = 1` or
      # `lto = "thin"` -- the settings `PERF.md` §6/§7.1 says are worth 45-49 to
      # 55-62 fps of the same source. The `opt-level` is also what `cmake-rs` reads
      # to pick raylib's `CMAKE_BUILD_TYPE`, so at `dev` the engine beside it is
      # `RelWithDebInfo` (-O2) where release gives it `Release` (-O3).
      - name: Build the cdylib
        run: cargo build --release -p goats-android --target aarch64-linux-android

      - name: Package the APK
        run: bash android/build-apk.sh release

      # Named like the desktop archives, and published with them on a `v*` tag.
      # Release-built but debug-signed: an APK to sideload and try, not one a store
      # would take.
      - name: Name the APK
        run: cp android/build/goats.apk goats-android-arm64-v8a.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-v8a
          path: goats-android-arm64-v8a.apk
          if-no-files-found: error

  # Only a tag publishes; ordinary pushes just build and keep the artifacts.
  release:
    name: Publish release
    # `android` as well: the APK is one of the four assets, and the desktop build
    # finishing says nothing about the phone one -- without this edge the release
    # could publish before `android` had even started, or after it had failed.
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By `name` rather than by `pattern` or by taking every artifact: one step per
      # asset, which is also the input that fails when an artifact is missing. A
      # `pattern` is a single glob handed to minimatch, so a newline-separated list
      # of these four names is one pattern that matches nothing -- download-artifact
      # then reports success having downloaded zero artifacts and never creates
      # `path` at all, which is how `dist` came to not exist. `name` also keeps a
      # future job's artifacts out of the release, which is the point of listing
      # them: the three desktop archives and the phone APK (debug-signed -- see the
      # `android` job).
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-aarch64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: android-arm64-v8a
          path: dist
      - name: List the assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          # A semver prerelease (`v0.2.0-rc.1`) is published as a prerelease;
          # `v0.2.0` stays a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
